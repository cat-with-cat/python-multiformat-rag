name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DASHSCOPE_API_KEY: ""
      LLM_API_KEY: ""
      LLM_PROVIDER: "dashscope"
      HF_HUB_OFFLINE: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python 3.10
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip

      - name: Install core and test dependencies
        run: python -m pip install -e '.[test]'

      - name: Prepare private bundled NLTK cache
        run: |
          export NLTK_DATA="$RUNNER_TEMP/nltk_data"
          echo "NLTK_DATA=$NLTK_DATA" >> "$GITHUB_ENV"
          python -c 'import os, shutil; from importlib.metadata import distribution; from pathlib import Path; source = Path(distribution("llama-index-core").locate_file("llama_index/core/_static/nltk_cache")); shutil.copytree(source, Path(os.environ["NLTK_DATA"]), dirs_exist_ok=True)'
          chmod -R go-w "$NLTK_DATA"

      - name: Run offline tests
        run: python -m pytest -q
