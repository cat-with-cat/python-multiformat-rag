[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "python-multiformat-document-rag"
version = "0.3.0"
description = "A traceable RAG CLI for TXT, CSV, PDF, and PPTX documents."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { file = "LICENSE" }
keywords = ["rag", "llamaindex", "embedding", "document-qa", "python"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "httpx>=0.28.1,<0.29",
  "llama-index-core>=0.14.25,<0.15",
  "llama-index-llms-dashscope>=0.7.0,<0.8",
  "pypdf>=6.21.1,<7",
  "python-dotenv>=1.2.4,<2",
  "python-pptx>=1.0.2,<2",
]

[project.optional-dependencies]
langchain = [
  "langchain-core>=1.6.5,<2",
]
local-embedding = [
  "llama-index-embeddings-huggingface>=0.8.0,<0.9",
  "sentence-transformers>=6.1.0,<7",
]
test = [
  "langchain-core>=1.6.5,<2",
  "pytest>=9.1.1,<10",
]

[project.scripts]
multiformat-rag = "multiformat_rag.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/multiformat_rag"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
